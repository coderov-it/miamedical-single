packages:
  - 'apps/*'
  - 'packages/*'

# Single source of truth for versions across every workspace package.
# Reference from any package.json with "catalog:".
catalog:
  # --- build / tooling ---
  turbo: ^2.10.12
  typescript: ^6.0.3
  vite: ^8.3.0
  '@types/node': ^26.5.1
  tsx: ^4.23.13
  prettier: ^3.9.6
  prettier-plugin-astro: ^1.0.0
  prettier-plugin-svelte: ^4.1.1
  prettier-plugin-tailwindcss: ^0.8.1
  vitest: ^5.0.0
  # Guards the preinstall script that blocks npm, yarn and bun.
  only-allow: ^1.2.2

  # --- linting ---
  # Prettier owns formatting; ESLint owns correctness only. `eslint-config-
  # prettier` and `svelte.configs.prettier` switch off every rule that would
  # otherwise fight `pnpm format`.
  eslint: ^10.10.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.70.0
  eslint-plugin-svelte: ^3.23.0
  eslint-config-prettier: ^10.1.8
  globals: ^17.12.0

  # --- astro storefront ---
  astro: ^7.3.2
  # Pinned to v8: the project-wide carousel engine (SSR-safe, vanilla JS).
  # v9 renames the scroll API (scrollPrev -> goToPrev) — do not mix.
  embla-carousel: ^8.6.0
  embla-carousel-autoplay: ^8.6.0
  '@astrojs/node': ^11.1.5
  '@astrojs/svelte': ^9.0.1
  '@astrojs/check': ^0.9.10
  '@astrojs/sitemap': ^3.7.4

  # --- svelte admin ---
  svelte: ^5.57.0
  '@sveltejs/kit': ^2.70.3
  '@sveltejs/adapter-static': ^3.0.10
  '@sveltejs/vite-plugin-svelte': ^7.3.0
  svelte-check: ^4.7.6

  # --- styling ---
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  # Drop-in `cn` (clsx + tailwind-merge in one). Zero runtime dependencies.
  cnfast: ^0.2.0

  # --- shadcn-svelte design system (components are vendored into apps/admin) ---
  'shadcn-svelte': ^1.6.1
  'bits-ui': ^2.19.2
  'tailwind-variants': ^3.3.1
  'tw-animate-css': ^1.4.0
  '@lucide/svelte': ^1.45.0
  '@fontsource-variable/geist': ^5.3.0
  '@internationalized/date': ^3.12.4
  'mode-watcher': ^1.1.0
  'svelte-sonner': ^1.2.1

  # --- server ---
  rolldown: ^1.2.8
  hono: ^4.13.7
  '@hono/node-server': ^2.1.1
  '@hono/valibot-validator': ^0.6.1

  # --- data ---
  'drizzle-orm': ^0.45.2
  'drizzle-kit': ^0.31.10
  'drizzle-valibot': ^0.4.2
  postgres: ^3.4.9

  # --- validation ---
  valibot: ^1.5.0
  # Runtime dep of @mia/validators; apps/server lists it too because the
  # bundle inlines that package's source (see apps/server/rolldown.config.ts).
  sanitize-html: ^2.17.7
  '@types/sanitize-html': ^2.16.1

  # --- auth ---
  '@node-rs/argon2': ^2.2.1

  # --- storage (Cloudflare R2 via the S3 API) + image conversion ---
  '@aws-sdk/client-s3': ^3.1131.0
  '@aws-sdk/client-sesv2': ^3.1131.0
  sharp: ^0.35.4

minimumReleaseAgeExclude:
  - '@astrojs/node@11.1.0'
  - astro@7.2.0
  - tsx@4.23.9
  - '@lucide/svelte@1.29.0'
  - eslint@10.8.1
  - '@turbo/darwin-64@2.10.11'
  - '@turbo/darwin-arm64@2.10.11'
  - '@turbo/linux-64@2.10.11'
  - '@turbo/linux-arm64@2.10.11'
  - '@turbo/windows-64@2.10.11'
  - '@turbo/windows-arm64@2.10.11'
  - turbo@2.10.11

# Postinstall scripts are blocked by default; approve them explicitly here.
allowBuilds:
  esbuild: true
  sharp: true
