packages:
  - 'apps/*'
  - 'packages/*'

# Single source of truth for versions across every workspace package.
# Reference from any package.json with "catalog:".
catalog:
  # --- build / tooling ---
  turbo: ^2.11.11
  typescript: ^6.0.3
  vite: ^8.3.8
  '@types/node': ^26.6.6
  tsx: ^4.23.15
  prettier: ^3.10.1
  prettier-plugin-astro: ^1.1.2
  prettier-plugin-svelte: ^4.1.1
  prettier-plugin-tailwindcss: ^0.8.1
  vitest: ^5.0.0
  # Guards the preinstall script that blocks npm, yarn and bun.
  only-allow: ^1.2.2

  # --- linting ---
  # Prettier owns formatting; ESLint owns correctness only. `eslint-config-
  # prettier` and `svelte.configs.prettier` switch off every rule that would
  # otherwise fight `pnpm format`.
  eslint: ^10.15.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.72.2
  eslint-plugin-svelte: ^3.24.1
  eslint-config-prettier: ^10.1.8
  globals: ^17.14.0

  # --- astro storefront ---
  astro: ^7.4.12
  # Pinned to v8: the project-wide carousel engine (SSR-safe, vanilla JS).
  # v9 renames the scroll API (scrollPrev -> goToPrev) — do not mix.
  embla-carousel: ^8.6.0
  embla-carousel-autoplay: ^8.6.0
  '@astrojs/node': ^11.1.13
  '@astrojs/svelte': ^9.1.6
  '@astrojs/check': ^0.9.12
  '@astrojs/sitemap': ^3.7.4

  # --- svelte admin ---
  svelte: ^5.57.3
  '@sveltejs/kit': ^2.70.4
  '@sveltejs/adapter-static': ^3.0.11
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  svelte-check: ^4.7.8

  # --- styling ---
  tailwindcss: ^4.3.5
  '@tailwindcss/vite': ^4.3.5
  # Drop-in `cn` (clsx + tailwind-merge in one). Zero runtime dependencies.
  cnfast: ^0.2.0

  # --- shadcn-svelte design system (components are vendored into apps/admin) ---
  'shadcn-svelte': ^1.8.1
  'bits-ui': ^2.21.0
  'tailwind-variants': ^3.3.1
  'tw-animate-css': ^1.4.0
  '@lucide/svelte': ^1.73.0
  '@fontsource-variable/geist': ^5.3.0
  '@internationalized/date': ^3.12.4
  'mode-watcher': ^1.1.0
  'svelte-sonner': ^1.2.3
  layerchart: ^2.10.1
  d3-scale: ^4.0.2
  d3-shape: ^3.2.1
  '@types/d3-shape': ^3.2.0
  '@types/d3-scale': ^4.0.9

  # --- server ---
  rolldown: ^1.3.2
  hono: ^4.13.18
  '@hono/node-server': ^2.1.8
  '@hono/valibot-validator': ^0.6.2

  # --- data ---
  'drizzle-orm': ^0.45.4
  'drizzle-kit': ^0.31.11
  'drizzle-valibot': ^0.4.2
  postgres: ^3.4.9

  # --- validation ---
  valibot: ^1.5.0
  # Runtime dep of @mia/validators; apps/server lists it too because the
  # bundle inlines that package's source (see apps/server/rolldown.config.ts).
  sanitize-html: ^2.18.2
  '@types/sanitize-html': ^2.16.2

  # --- auth ---
  '@node-rs/argon2': ^2.2.2

  # --- storage (Cloudflare R2 via the S3 API) + image conversion ---
  '@aws-sdk/client-s3': ^3.1169.0
  '@aws-sdk/client-sesv2': ^3.1169.0
  sharp: ^0.35.5

minimumReleaseAgeExclude:
  - '@astrojs/node@11.1.0'
  - astro@7.2.0
  - tsx@4.23.9
  - '@lucide/svelte@1.29.0'
  - eslint@10.8.1
  - '@turbo/darwin-64@2.10.11 || 2.11.7'
  - '@turbo/darwin-arm64@2.10.11 || 2.11.7'
  - '@turbo/linux-64@2.10.11 || 2.11.7'
  - '@turbo/linux-arm64@2.10.11 || 2.11.7'
  - '@turbo/windows-64@2.10.11 || 2.11.7'
  - '@turbo/windows-arm64@2.10.11 || 2.11.7'
  - turbo@2.10.11 || 2.11.7

# Postinstall scripts are blocked by default; approve them explicitly here.
allowBuilds:
  esbuild: true
  sharp: true
