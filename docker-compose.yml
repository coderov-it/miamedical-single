services:
  postgres:
    image: postgres:18-alpine
    container_name: mia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: miamedical
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18+ expects a single mount at /var/lib/postgresql (not /data),
      # so pg_upgrade --link works without crossing a mount boundary.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d miamedical']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
