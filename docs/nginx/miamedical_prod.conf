# /etc/nginx/sites-available/miamedical_prod
#
# PRODUCTION instance. The dev instance lives in miamedical_dev.conf; the two
# run side by side on the same box, so everything here is suffixed _prod and
# uses its own ports, web root, and logs — nginx upstream names and
# server_names are global across all enabled sites and must not collide.
#
# Three vhosts, three different jobs:
#   api.miamedicalitalia.com    -> proxy to the API process   (API_PORT in prod .env)
#   miamedicalitalia.com        -> proxy to the website SSR   (WEB_PORT in prod .env)
#   admin.miamedicalitalia.com  -> static files, no process   (apps/admin/dist)
#
# TLS terminates in front of nginx (Cloudflare proxied DNS), which is why every
# server listens on :80 and X-Forwarded-Proto is hardcoded to https. If nginx
# ever terminates TLS itself, switch those to `listen 443 ssl` + `$scheme`.

upstream mia_api_prod {
    server 127.0.0.1:8787;   # = API_PORT in the prod checkout's .env
    keepalive 16;
}

upstream mia_web_prod {
    server 127.0.0.1:4287;   # = WEB_PORT in the prod checkout's .env
    keepalive 16;
}

# ---------------------------------------------------------------------------
# API — api.miamedicalitalia.com
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name api.miamedicalitalia.com;

    access_log /var/log/nginx/prod-api.access.log;
    error_log  /var/log/nginx/prod-api.error.log;

    # Media uploads go through the API (video cap is 30 MB); nginx's 1 MB
    # default would reject them with 413 before the API ever sees the request.
    client_max_body_size 40m;

    location / {
        proxy_pass http://mia_api_prod;
        proxy_http_version 1.1;
        proxy_set_header Connection "";   # required for upstream keepalive

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ---------------------------------------------------------------------------
# Website (SSR) — miamedicalitalia.com (+ www redirect to the apex)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name www.miamedicalitalia.com;

    return 301 https://miamedicalitalia.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;

    server_name miamedicalitalia.com;

    access_log /var/log/nginx/prod-web.access.log;
    error_log  /var/log/nginx/prod-web.error.log;

    location / {
        proxy_pass http://mia_web_prod;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ---------------------------------------------------------------------------
# Admin (static SPA) — admin.miamedicalitalia.com
#
# No process behind this vhost. Deploy = build apps/admin and copy the output:
#   rsync -a --delete apps/admin/dist/ /var/www/miamedicalitalia/admin/
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name admin.miamedicalitalia.com;

    access_log /var/log/nginx/prod-admin.access.log;
    error_log  /var/log/nginx/prod-admin.error.log;

    root  /var/www/miamedicalitalia/admin;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build output — the filename changes on every build, so the old
    # file can be cached forever without ever going stale.
    location /_app/immutable/ {
        expires max;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: try_files does an INTERNAL rewrite, not a redirect — the
    # browser URL stays on the deep link (e.g. /orders/42 on a hard refresh)
    # and the SvelteKit client router picks the route up from it. A 3xx here
    # would lose the path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The shell must never be cached, or users keep running a stale build
    # (pointing at deleted hashed chunks) after every deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
