# /etc/nginx/sites-available/miamedical_dev
#
# DEVELOPMENT instance. Runs alongside miamedical_prod.conf on the same box:
# a second checkout of the repo with its own .env, its own processes on
# shifted ports (prod +1), its own web root, and _dev-suffixed upstream names
# so both site files can be enabled at once without collisions.
#
# Three vhosts, three different jobs:
#   dev-api.miamedicalitalia.com    -> proxy to the dev API process   (API_PORT in dev .env)
#   dev.miamedicalitalia.com        -> proxy to the dev website SSR   (WEB_PORT in dev .env)
#   dev-admin.miamedicalitalia.com  -> static files, no process       (apps/admin/dist)
#
# The dev checkout's .env must therefore set:
#   API_PORT=8788
#   WEB_PORT=4289
#
# WEB_PORT breaks the "prod +1" pattern above — the running dev .env says 4289,
# not 4288, and the upstream below follows the .env rather than the pattern.
# Change both together or the vhost 502s.
#
# TLS terminates in front of nginx (Cloudflare proxied DNS), which is why every
# server listens on :80 and X-Forwarded-Proto is hardcoded to https. If nginx
# ever terminates TLS itself, switch those to `listen 443 ssl` + `$scheme`.
#
# CHECKOUT: /root/miamedical-single-dev
#
# Both the website's built assets and the admin's files are served straight from
# that checkout, so there is no copy step and nothing to keep in sync. It costs
# one prerequisite, once per box:
#
#   chmod o+x /root      # nginx runs as www-data and cannot traverse 0700 /root
#
# That grants traversal, not listing — but any world-readable file under /root
# becomes readable by any local user who knows its path, and `.env` is 0644 by
# default. Tighten it in the same breath:
#
#   chmod 600 /root/miamedical-single-dev/.env

upstream mia_api_dev {
    server 127.0.0.1:8788;   # = API_PORT in the dev  .env
    keepalive 16;
}

upstream mia_web_dev {
    server 127.0.0.1:4289;   # = WEB_PORT in the dev .env
    keepalive 16;
}

# ---------------------------------------------------------------------------
# API — dev-api.miamedicalitalia.com
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name dev-api.miamedicalitalia.com;

    access_log /var/log/nginx/dev-api.access.log;
    error_log  /var/log/nginx/dev-api.error.log;

    # Media uploads go through the API (video cap is 30 MB); nginx's 1 MB
    # default would reject them with 413 before the API ever sees the request.
    client_max_body_size 40m;

    location / {
        proxy_pass http://mia_api_dev;
        proxy_http_version 1.1;
        proxy_set_header Connection "";   # required for upstream keepalive

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ---------------------------------------------------------------------------
# Website (SSR) — dev.miamedicalitalia.com
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name dev.miamedicalitalia.com;

    access_log /var/log/nginx/dev-web.access.log;
    error_log  /var/log/nginx/dev-web.error.log;

    # The Node adapter compresses nothing, so every byte of a 53 KB page and a
    # 74 KB stylesheet crosses to the edge raw. text/html is always in
    # gzip_types and must not be listed again.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;   # required: the body arrives from an upstream, not from disk
    gzip_vary on;       # Vary: Accept-Encoding, or a cache serves gzip to a client that cannot read it

    # Inherited by every location below. Do not repeat a proxy_set_header
    # inside one — a location that sets any of them inherits none of them.
    proxy_http_version 1.1;
    proxy_set_header Connection "";   # required for upstream keepalive
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # The website's built assets, served off disk by nginx instead of through
    # the Node process. `try_files … @web` keeps a missing file working.
    root /root/miamedical-single-dev/apps/website/dist/client;

    # Content-hashed filenames: a new build is a new name, so the old bytes can
    # be cached forever without ever going stale.
    location /_astro/ {
        try_files $uri @web;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fonts are not hashed, but their bytes never change — a new weight is a new
    # file. Replacing one in place would strand caches for a year, so don't:
    # rename it.
    location /fonts/ {
        try_files $uri @web;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Not hashed, and these do get replaced in place — a new logo keeps the same
    # filename. A week is the longest wait worth accepting for that, and a
    # Cloudflare purge on deploy makes it immediate at the edge.
    location /img/ {
        try_files $uri @web;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /favicon.svg {
        try_files $uri @web;
        add_header Cache-Control "public, max-age=604800";
    }

    # HTML. The page decides its own caching: `cacheHtml()` in
    # `lib/http-cache.ts` sends s-maxage + stale-while-revalidate for pages that
    # are the same for everyone, and no-store for cart, checkout and the
    # customer area. Nothing is cached here — Cloudflare is the shared cache in
    # front, and it does not cache HTML until a Cache Rule says to. Before
    # writing that rule, read the deploy note in
    # docs/code/storefront-caching.md: cached HTML outlives the hashed assets it
    # points at, so a release has to purge.
    location / {
        proxy_pass http://mia_web_dev;
    }

    # Everything the asset locations above fall through to. A file missing from
    # `dist/client` — a stale build, a path the adapter serves itself — reaches
    # the Node process instead of 404ing, so a wrong root degrades to the old
    # behaviour rather than breaking the site.
    location @web {
        proxy_pass http://mia_web_dev;
    }
}

# ---------------------------------------------------------------------------
# Admin (static SPA) — dev-admin.miamedicalitalia.com
#
# No process behind this vhost, and no copy step: nginx serves the build
# output where it lands. Deploy = `pnpm --filter @mia/admin build` in
# /root/miamedical-single-dev.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    server_name dev-admin.miamedicalitalia.com;

    access_log /var/log/nginx/dev-admin.access.log;
    error_log  /var/log/nginx/dev-admin.error.log;

    root  /root/miamedical-single-dev/apps/admin/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build output — the filename changes on every build, so the old
    # file can be cached forever without ever going stale.
    location /_app/immutable/ {
        expires max;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: try_files does an INTERNAL rewrite, not a redirect — the
    # browser URL stays on the deep link (e.g. /orders/42 on a hard refresh)
    # and the SvelteKit client router picks the route up from it. A 3xx here
    # would lose the path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The shell must never be cached, or users keep running a stale build
    # (pointing at deleted hashed chunks) after every deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
